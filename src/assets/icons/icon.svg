<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the icon works as a maskable icon (OS crops to circle/squircle). -->
  <rect width="512" height="512" fill="#166534"/>
  <path d="M0 300 C120 260 200 360 512 280 V512 H0 Z" fill="#14532d"/>
  <!-- Parcel kept inside the central 80% safe zone. -->
  <polygon points="150,170 330,130 370,300 250,380 140,320" fill="#facc15" fill-opacity="0.3"
           stroke="#facc15" stroke-width="14" stroke-linejoin="round"/>
  <g fill="#facc15" stroke="#111" stroke-width="6">
    <circle cx="150" cy="170" r="20"/>
    <circle cx="330" cy="130" r="20"/>
    <circle cx="370" cy="300" r="20"/>
    <circle cx="250" cy="380" r="20"/>
    <circle cx="140" cy="320" r="20"/>
  </g>
</svg>
